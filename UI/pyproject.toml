[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-dashboard"
version = "1.0.0"
description = "Dashboard evaluasi reliabilitas LLM-as-a-Judge (bias posisi & sensitivitas prompt) berbahasa Indonesia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
# Inferensi CPU lokal/VPS (GGUF Q4_K_M)
cpu = ["llama-cpp-python>=0.2.70"]
# Inferensi Colab GPU (4-bit NF4)
gpu = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_reliability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
src = ["llm_reliability", "tests"]
