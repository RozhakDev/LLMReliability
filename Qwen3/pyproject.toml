[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast CPU-only unit tests with no heavy model or statistical runtime dependencies",
    "integration: end-to-end multi-component tests",
    "transformers: tests requiring Hugging Face transformers runtime",
    "statsmodels: tests requiring statsmodels runtime",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_ignores = true
warn_redundant_casts = true
